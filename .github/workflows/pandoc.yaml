on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      image_ref:
        description: GHCR image built in this run (SHA tag)
        required: true
        type: string

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version/date consistency
        run: |
          wd="${{ inputs.working-directory }}"
          wd="${wd#./}"
          PDF_VER=$(grep -oP 'Ver\.\d+\.\d+\.\d+' config-pdf.yaml)
          EPUB_VER=$(grep -oP 'Ver\.\d+\.\d+\.\d+' config-epub.yaml)
          if [ "$wd" = "main-en" ]; then
            PDF_DATE_EN=$(grep bookVersion config-pdf.yaml | grep -oP '[A-Z][a-z]+ \d+, \d{4}')
            PDF_DATE=$(echo "$PDF_DATE_EN" | awk '{
              months["January"]=1; months["February"]=2; months["March"]=3; months["April"]=4;
              months["May"]=5; months["June"]=6; months["July"]=7; months["August"]=8;
              months["September"]=9; months["October"]=10; months["November"]=11; months["December"]=12;
              month = $1; day = $2; sub(",", "", day); year = $3;
              printf "%04d-%02d-%02d", year, months[month], day
            }')
          else
            PDF_DATE_JP=$(grep bookVersion config-pdf.yaml | grep -oP '\d+年\d+月\d+日')
            PDF_DATE=$(echo "$PDF_DATE_JP" | sed 's/年/-/g;s/月/-/g;s/日//' | awk -F'-' '{printf "%04d-%02d-%02d", $1, $2, $3}')
          fi
          EPUB_DATE=$(grep -oP '(?<=date: )\d{4}-\d{2}-\d{2}' config-epub.yaml)
          ERROR=0
          if [ "$PDF_VER" != "$EPUB_VER" ]; then
            echo "::error::Version mismatch! config-pdf.yaml=$PDF_VER, config-epub.yaml=$EPUB_VER"
            ERROR=1
          fi
          if [ "$PDF_DATE" != "$EPUB_DATE" ]; then
            echo "::error::Date mismatch! config-pdf.yaml=$PDF_DATE, config-epub.yaml=$EPUB_DATE"
            ERROR=1
          fi
          if [ $ERROR -eq 0 ]; then echo "Version/Date OK: $PDF_VER / $EPUB_DATE"; fi
          exit $ERROR

  # 通常PDF / 表紙なしPDF / EPUB を並列。upload-artifact@v7 の archive:false は1ファイル制限。
  # 表紙パスに日本語があるため、コンテナ内は UTF-8 ロケール必須。
  # スクリプトはリポジトリ直下の build/ にあるので working-directory はルート。
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build PDF
        run: |
          wd="${{ inputs.working-directory }}"
          wd="${wd#./}"
          echo "Using image: ${{ inputs.image_ref }} variant=${wd}"
          chmod +x ./build/build-pdf.sh
          ./build/build-pdf.sh cover "$wd"
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: |
            tmp/servertext_*.pdf
            !tmp/servertext_*_no_cover.pdf
          archive: false
          if-no-files-found: error

  build-pdf-no-cover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build PDF (no cover)
        run: |
          wd="${{ inputs.working-directory }}"
          wd="${wd#./}"
          echo "Using image: ${{ inputs.image_ref }} variant=${wd}"
          chmod +x ./build/build-pdf.sh
          ./build/build-pdf.sh no-cover "$wd"
      - name: Upload PDF no-cover artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: tmp/servertext_*_no_cover.pdf
          archive: false
          if-no-files-found: error

  build-epub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build EPUB
        run: |
          wd="${{ inputs.working-directory }}"
          wd="${wd#./}"
          echo "Using image: ${{ inputs.image_ref }} variant=${wd}"
          chmod +x ./build/build-epub.sh ./build/with-build-image.sh
          ./build/build-epub.sh "$wd"
      - name: Upload EPUB artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: tmp/servertext_*.epub
          archive: false
          if-no-files-found: error
